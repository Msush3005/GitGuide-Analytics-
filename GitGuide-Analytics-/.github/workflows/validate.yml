name: Data Validation

on:
  push:
    branches: [main, develop, setup/dev-environment, "feature/**"]
  pull_request:
    branches: [main, setup/dev-environment]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Data Schema & Quality Validation
        run: |
          python validate_data.py data/raw/fetched_github_repo_data.csv
