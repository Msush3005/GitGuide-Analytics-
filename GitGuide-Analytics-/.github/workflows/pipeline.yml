name: Weekly Data Pipeline

on:
  schedule:
    - cron: "0 6 * * 1" # Runs every Monday at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Data Pipeline
        run: |
          python pipeline.py --input data/raw/fetched_github_repo_data.csv --output output

      - name: Commit & Push Processed Output
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "bot@github.com"
          git add output/
          git commit -m "pipeline: automated data refresh [skip ci]" || echo "No changes to commit"
          git push
